<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />

    <title>TenK — Broke But Functional: Survive the Month</title>
    <meta
      name="description"
      content="Broke But Functional — Survive the Month: an interactive personal finance experience for Gen Z, built around a ₹10,000 budget over 30 days. Simulate any financial decision before taking it and see exactly how it moves your remaining balance, daily allowance, savings goals, monthly forecast, financial risk and overall financial health."
    />
    <meta name="author" content="Aryan" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TenK — Broke But Functional: Survive the Month" />
    <meta
      property="og:description"
      content="₹10,000. 30 days. Simulate a decision and watch your balance, daily allowance, savings goals, forecast, risk and financial health all respond together."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Applies the saved theme before first paint so there is no flash.
         Inline and tiny on purpose — do not move this into a module. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <!-- A Vite app paints nothing until the bundle has downloaded, parsed and
         mounted. This skeleton is plain markup in the initial HTML, so the
         first paint happens while that is still in flight. React clears it on
         mount; the measurements it reserves match the real layout, so there is
         no shift when the content arrives. Inline on purpose — a separate file
         would be one more round trip and defeat the point. -->
    <style>
      #boot { animation: boot-in 0.3s ease-out both }
      #boot .bar { background: #e2e8f0; border-radius: 6px }
      html.dark #boot .bar { background: #1e293b }
      #boot .hd { height: 64px; border-bottom: 1px solid #e2e8f0 }
      html.dark #boot .hd { border-color: #1e293b }
      #boot .wrap { max-width: 1280px; margin: 0 auto; padding: 0 1rem }
      #boot .cards { display: grid; gap: 1rem; grid-template-columns: 1fr; margin-top: 1.5rem }
      @media (min-width: 640px) { #boot .cards { grid-template-columns: 1fr 1fr } }
      @media (min-width: 1024px) { #boot .cards { grid-template-columns: repeat(4, 1fr) } }
      @keyframes boot-in { from { opacity: 0 } to { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { #boot { animation: none } }
    </style>

    <div id="root">
      <div id="boot" aria-hidden="true">
        <div class="hd">
          <div class="wrap" style="display: flex; align-items: center; height: 64px; gap: 12px">
            <div class="bar" style="width: 32px; height: 32px; border-radius: 8px"></div>
            <div class="bar" style="width: 64px; height: 18px"></div>
          </div>
        </div>
        <div class="wrap" style="padding-top: 2rem">
          <div class="bar" style="width: min(100%, 560px); height: 34px"></div>
          <div class="bar" style="width: min(100%, 620px); height: 16px; margin-top: 14px"></div>
          <div class="bar" style="width: min(100%, 480px); height: 16px; margin-top: 8px"></div>
          <div class="cards">
            <div class="bar" style="height: 148px"></div>
            <div class="bar" style="height: 148px"></div>
            <div class="bar" style="height: 148px"></div>
            <div class="bar" style="height: 148px"></div>
          </div>
        </div>
      </div>
    </div>

    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1rem; font-family: system-ui, sans-serif">
        <h1>TenK — Broke But Functional: Survive the Month</h1>
        <p>
          A modern, interactive personal finance experience for a limited ₹10,000 budget across 30
          days. TenK connects your income, balance, spending, commitments, savings goals,
          subscriptions and unexpected expenses into one calculation, so you can simulate a
          financial decision before you take it and see exactly how it changes your remaining
          balance, daily allowance, savings goals, monthly forecast, financial risk and overall
          financial health.
        </p>
        <p>This application needs JavaScript enabled to run.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
